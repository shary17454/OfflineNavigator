version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rawaya
      POSTGRES_PASSWORD: rawaya
      POSTGRES_DB: rawaya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rawaya
      MINIO_ROOT_PASSWORD: rawaya12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      DATABASE_URL: postgresql://rawaya:rawaya@postgres:5432/rawaya
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me
      JWT_REFRESH_SECRET: change-me-refresh
      PORT: 4000
      NODE_ENV: development
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: rawaya
      S3_SECRET_KEY: rawaya12345
      S3_BUCKET: rawaya-media
      S3_REGION: us-east-1
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  web:
    build: ./apps/web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api
    ports:
      - "3001:3000"

  admin:
    build: ./apps/admin
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  minio_data:
