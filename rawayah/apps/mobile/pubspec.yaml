publish_to: 'none'
version: 0.1.0+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.6.0
  go_router: ^14.2.7
  shared_preferences: ^2.2.3
