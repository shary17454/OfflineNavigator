  file_picker: ^8.1.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
