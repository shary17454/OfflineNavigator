name: Mawrooth CI

on:
  push:
    paths:
      - "rawayah/**"
      - ".github/workflows/rawaya-ci.yml"
  pull_request:
    paths:
      - "rawayah/**"
      - ".github/workflows/rawaya-ci.yml"

concurrency:
  group: mawrooth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-web-admin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rawaya
          POSTGRES_PASSWORD: rawaya
          POSTGRES_DB: rawaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rawaya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://rawaya:rawaya@localhost:5432/rawaya
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    defaults:
      run:
        working-directory: rawayah
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rawayah/package-lock.json
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  mobile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: rawayah/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
