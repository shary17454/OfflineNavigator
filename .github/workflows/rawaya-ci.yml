name: Mawrooth CI

on:
  push:
    branches:
      - main
    paths:
      - "rawayah/**"
      - ".github/workflows/rawaya-ci.yml"
  pull_request:
    paths:
      - "rawayah/**"
      - ".github/workflows/rawaya-ci.yml"

concurrency:
  group: mawrooth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: rawayah/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
